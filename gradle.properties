# Important Notes:
# A field used as ${...} in fabric.mod.json, *.mixins.json or pack.mcmeta must also be added to the expandProps map
# in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=0.1.0
group=io.github.livingdeaddolls
java_version=25

# Common
minecraft_version=26.2
mod_name=Structure Waypoints
mod_author=Yuhrp
mod_id=structurewaypoints
license=MIT
credits=
description=A client-side Fabric mod that works out where structures are from the world's seed and shows them as waypoints through Waypoints API.
# Game versions the jar loads on (fabric.mod.json)
fabric_minecraft_dependency=~26.2
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.2
fabric_loader_version=0.19.5

# Dependencies
# YetAnotherConfigLib: https://modrinth.com/mod/yacl (artifact is <yacl_version>-fabric)
yacl_version=3.9.7+26.2
# Mod Menu (Fabric only, optional): https://modrinth.com/mod/modmenu
modmenu_version=20.0.3
# Seed Engine API (required, nested in the jar): works out the structures from the seed. Built with ./gradlew publishToMavenLocal in its
# repository, read from the local Maven repository.
seedengine_version=0.1.0+26.2
# Waypoints API (required, nested in the jar): shows the structures as waypoints. Built with ./gradlew publishToMavenLocal in its
# repository, read from the local Maven repository.
waypointsapi_version=0.1.0+26.2

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=true
